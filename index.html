<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="application-name" content="AllTheAldi"/>
<meta name="apple-mobile-web-app-title" content="AllTheAldi"/>
<meta name="theme-color" content="#245C45"/>
<meta name="description" content="Your shopping list sorted into the quickest walk around Aldi stores in Ireland."/>
<!-- Lets phones install this as a proper app (these files sit next to index.html) -->
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="allthealdiicon.png"/>
<link rel="apple-touch-icon" href="allthealdiicon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>AllTheAldi</title>
<style>

:root{--bg:#f4f0e6;--ink:#162033;--muted:#5c6570;--faint:#8a8276;--line:#e4dccb;--line2:#cfc6b4;--surface:#fffdf8;--surface2:#efe8d8;--green:#245c45;--green2:#1a4634;--cream:#f7f1e4;--danger:#9b3a2f;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 120px}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:600}
h1{font-size:clamp(36px,6vw,48px);margin-top:4px}
.lede{color:var(--muted);font-size:14px;max-width:28rem;margin:8px 0 0}
.row{display:flex;gap:8px;margin-top:22px}
input[type=text]{flex:1;height:48px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:0 14px}
.btn{height:48px;border:0;border-radius:10px;background:var(--green);color:#fff;padding:0 16px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost,.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line2);height:40px;font-size:14px}
.btn.tiny{height:36px;font-size:13px;padding:0 10px}
.hint{margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(22,32,51,.04)}
.card h2{font-size:20px}
.sub{font-size:12px;color:var(--muted)}
svg.map{width:100%;height:auto;display:block}
.zone{margin-top:22px}
.zone h3{font-size:18px;margin:0 0 8px}
.item{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.item button.name{flex:1;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer}
.item.done .name{text-decoration:line-through;color:var(--faint)}
.qty{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer}
.skip{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.empty{text-align:center;border:1px dashed var(--line2);border-radius:14px;padding:28px 16px;background:var(--surface)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,240,230,.95);border-top:1px solid var(--line);padding:12px 16px}
.bar .btn{width:min(720px,100%);display:block;margin:0 auto}
.shop{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:16px 16px 40px}
.shop header{display:flex;justify-content:space-between;align-items:center;gap:12px}
select{height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--surface)}
.badge{font-size:12px;color:var(--muted)}
.credit{display:flex;justify-content:center;margin-top:36px}
.credit img{height:36px;width:auto;max-width:min(100%,260px)}
.map-path{fill:none;stroke:#245c45;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* ---- fixes and new bits ---- */
.item{display:block;min-height:0;padding:6px 0 8px}
.item .main{display:flex;align-items:center;gap:10px;min-height:44px}
.item input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--green)}
.item .acts{display:flex;flex-wrap:wrap;gap:4px 16px;padding-left:32px}
.item .acts .skip{padding:6px 0}
.zone-pick{display:block;width:calc(100% - 32px);max-width:100%;margin:4px 0 4px 32px;height:40px;font-size:15px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.arrange-link{display:block;width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;height:42px;font-weight:600;color:var(--green);cursor:pointer}
.bar{z-index:10}
.shop{z-index:20}
.arr{list-style:none;margin:18px 0 8px;padding:0}
.arr li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.arr-no{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.arr-name{flex:1;font-weight:600}
.arr-btn{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-size:15px;cursor:pointer}
.arr-btn:disabled{opacity:.3;cursor:default}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#162033;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#9fe0bf;font-weight:700;margin-left:10px;cursor:pointer;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(22,32,51,.45);display:grid;place-items:end center;z-index:50;padding:16px}
.sheet-box{background:var(--surface);border-radius:16px;padding:16px;width:min(560px,100%)}
.sheet textarea{width:100%;height:220px;margin:10px 0;border:1px solid var(--line2);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,monospace;background:var(--bg)}
.sheet .btn{width:100%}
.check{margin-top:16px;border:2px solid #e2b04a;background:#fff8e6;border-radius:14px;padding:12px 14px}
.check h2{font-size:19px}
.check .sub{margin:4px 0 6px}
.check-row{padding:8px 0;border-top:1px solid #f0dfb3}
.check-row:first-of-type{border-top:0}
.check-name{font-weight:600;margin-bottom:4px}
.check-ctrl{display:flex;gap:8px;align-items:center}
.check-ctrl .zone-pick{margin:0;width:auto;flex:1;min-width:0}
.check-ctrl .btn.tiny{height:40px;min-width:48px;font-size:18px}
.badge.guess{color:#a16207}
.ok-guess{color:var(--green)!important;font-weight:600}
</style>
</head>

const MAP = {width:360,height:292,
  entrance:{x:10,y:10,w:72,h:28}, tills:{x:88,y:10,w:236,h:28},
  zones:{
    produce:{x:10,y:46,w:100,h:36}, bakery:{x:114,y:46,w:100,h:36}, specialbuys:{x:218,y:46,w:110,h:36},

  }};
const LEFT = 5, RIGHT = 333, TOP_WALK = 42;
// Where you stand to shop each department: in front of the blocks, or walking down the aisle
function visitPoint(id){
  const r = MAP.zones[id];
  if (r.y < 85) return {x:r.x + r.w/2, y:85};
  if (r.y >= 240) return {x:r.x + r.w/2, y:238};
  return {x:r.x + r.w/2, y:r.y + r.h/2};
}
// Walks along the aisles and side walkways, snaking down one aisle and back up the next,
// instead of cutting through the shelves
const isAisle = id => { const r = MAP.zones[id]; return r.y >= 85 && r.y < 240; };
function walkPath(stops){
  const start = {x:MAP.entrance.x + MAP.entrance.w/2, y:TOP_WALK};
  const till = {x:MAP.tills.x + MAP.tills.w/2, y:TOP_WALK};
  const pts = [start], visits = [];
  let cur = start;
  const go = p => { pts.push(p); cur = p; };
  for (const id of stops.filter(id => MAP.zones[id])){
    const r = MAP.zones[id];
    if (isAisle(id)){
      const y = r.y + r.h/2;
      const side = Math.abs(cur.x - LEFT) <= Math.abs(cur.x - RIGHT) ? LEFT : RIGHT;
      if (cur.x !== side) go({x:side, y:cur.y});
      if (cur.y !== y) go({x:side, y});
      go({x: side === LEFT ? RIGHT : LEFT, y});          // walk the whole aisle
      visits.push({x:r.x + r.w/2, y});
    } else {
      const v = visitPoint(id);
      if (Math.abs(cur.y - v.y) > 1){
        const cx = Math.abs(cur.x - LEFT) + Math.abs(v.x - LEFT) <= Math.abs(cur.x - RIGHT) + Math.abs(v.x - RIGHT) ? LEFT : RIGHT;
        if (cur.x !== cx) go({x:cx, y:cur.y});
        go({x:cx, y:v.y});
      }
      go(v); visits.push(v);
    }
  }
  if (cur.x !== RIGHT) go({x:RIGHT, y:cur.y});
  go({x:RIGHT, y:TOP_WALK}); go(till);
  return {pts, visits};
}

/* ---------- Understanding the list ---------- */
function norm(v){return String(v||"").toLowerCase().replace(/[&/_,.!?'"’]/g," ").replace(/\s+/g," ").trim()}
const INDEX = [];
{
  const seen = new Set();
  for (const e of CATALOG){
    const add = key => { const k = norm(key); if (!k || seen.has(k)) return; seen.add(k); INDEX.push({key:k, zone:e.zone}); };
    add(e.label); for (const a of e.aliases) add(a);
  }
  INDEX.sort((a,b)=>b.key.length-a.key.length);
}
const UNIT = "kg|g|l|ml|pk|pack|packs|bag|bags|punnet|punnets|loaf|loaves|tin|tins|jar|jars|box|boxes|bottle|bottles";
function parseEntry(raw){
  const text = raw.trim().replace(/\s+/g," ");
  if (!text) return null;
  let m = text.match(/^(\d+(?:\.\d+)?)\s*x\s+(.+)$/i); if (m) return {qty:+m[1],unit:null,name:m[2].trim()};
  m = text.match(/^(.+?)\s+x\s*(\d+(?:\.\d+)?)$/i); if (m) return {qty:+m[2],unit:null,name:m[1].trim()};
  m = text.match(new RegExp("^(\\d+(?:\\.\\d+)?)\\s*("+UNIT+")\\s+(?:of\\s+)?(.+)$","i")); if (m) return {qty:+m[1],unit:m[2],name:m[3].trim()};
  m = text.match(/^(\d+(?:\.\d+)?)\s+(.+)$/); if (m) return {qty:+m[1],unit:null,name:m[2].trim()};
  m = text.match(/^a\s+dozen\s+(.+)$/i); if (m) return {qty:12,unit:null,name:m[1].trim()};
  return {qty:1,unit:null,name:text};
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// Finds the department. The last word usually says what the thing is:
// "chicken soup" is soup, "cheese and onion crisps" are crisps.
// Returns {zone, sure}. "sure" means it knows the whole name or its last word.
// Otherwise it's only a guess, and the person is asked to check it.
function classify(name){
  const n = norm(name); if (!n) return {zone:"unplaced", sure:false};
  if (learned[n]) return {zone:learned[n], sure:true};
  if (/^frozen\s/.test(n) || /\sfrozen$/.test(n)) return {zone:"frozen", sure:true};   // "frozen prawns" live in the freezer
  const exact = INDEX.find(r=>r.key===n); if (exact) return {zone:exact.zone, sure:true};
  let best = null, bestScore = 0;
  for (const row of INDEX){
    if (row.key.length < 3) continue;
    const k = escRe(row.key);
    let score = 0;
    if (new RegExp("(?:^|\\s)"+k+"(?:s|es)?$").test(n)) score = 1000 + row.key.length;          // it's the last word(s)
    else if (new RegExp("(?:^|\\s)"+k+"(?:s|es)?(?:\\s|$)").test(n)) score = 100 + row.key.length; // somewhere in the name
    else if (row.key.length >= 5 && n.length >= 3 && new RegExp("(?:^|\\s)"+escRe(n)+"(?:s|es)?(?:\\s|$)").test(row.key)) score = 10 + n.length; // typed a shorter name
    if (score > bestScore){ bestScore = score; best = row.zone; }
  }
  return best ? {zone:best, sure:bestScore >= 1000} : {zone:"unplaced", sure:false};
}

function merge(name, qty, unit, zone, unsure){
  const key = name.toLowerCase();
  const ex = state.items.find(it=>!it.checked && it.name.toLowerCase()===key && (it.unit||"")===(unit||""));
  if (ex){ ex.qty += qty; ex.deferred = false; return; }
  state.items.push({id:uid(), name, qty, unit:unit||null, zoneId:zone, unsure:!!unsure && zone!=="unplaced", checked:false, deferred:false, createdAt:Date.now()});
}
function addRaw(raw){
  const parts = String(raw).split(/[\n;]+/).flatMap(l=>l.split(",")).map(s=>s.trim()).filter(Boolean).slice(0,60);
  let n = 0;
  for (const part of parts){
    const p = parseEntry(part); if (!p || !p.name) continue;
    const c = classify(p.name);
    merge(tidy(p.name), p.qty, p.unit, c.zone, !c.sure); n++;
  }
  return n;
}
function stopsOf(onlyOpen){
  const src = onlyOpen ? state.items.filter(i=>!i.checked) : state.items;
  const present = new Set(src.map(i=>i.zoneId));
  return walk().filter(id=>present.has(id));
}
function openStops(){
  const src = state.items.filter(i=>!i.checked && !i.deferred);
  const present = new Set(src.map(i=>i.zoneId));
  const out = order.filter(id=>present.has(id));
  if (present.has("unplaced")) out.push("unplaced");
  if (state.items.some(i=>!i.checked && i.deferred)) out.push("later");
  return out;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function qtyText(it){ if (it.unit) return it.qty+" "+it.unit; if (it.qty>1) return "×"+it.qty; return ""; }

/* ---------- Drawing ---------- */
function mapSvg(stops, preview){
  const route = walkPath(stops.filter(id=>id!=="unplaced" && id!=="later"));
  const d = route.pts.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");
  const rects = Object.entries(MAP.zones).map(([id,r])=>{
    const on = stops.includes(id);
    return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6" fill="${on?"#e7f2ec":"#f6f1e6"}" stroke="${on?"#245c45":"#e4dccb"}"/>`;
  }).join("");
  const labels = Object.entries(MAP.zones).map(([id,r])=>
    `<text x="${r.x+8}" y="${r.y + (r.h>30 ? 14 : r.h/2+4)}" font-size="11" fill="#162033">${esc(BY[id].short)}</text>`).join("");
  const marks = preview ? "" : route.visits.map((v,i)=>`<circle cx="${v.x}" cy="${v.y}" r="7" fill="#245c45"/><text x="${v.x}" y="${v.y+3.5}" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">${i+1}</text>`).join("");
  return `<svg class="map" viewBox="0 0 ${MAP.width} ${MAP.height}" role="img" aria-label="Your walk around the store">
    <rect x="0" y="0" width="${MAP.width}" height="${MAP.height}" rx="12" fill="#fffdf8"/>
    <rect x="${MAP.entrance.x}" y="${MAP.entrance.y}" width="${MAP.entrance.w}" height="${MAP.entrance.h}" rx="6" fill="#245c45"/>
    <text x="${MAP.entrance.x+10}" y="${MAP.entrance.y+18}" fill="#fff" font-size="12">In</text>
    <rect x="${MAP.tills.x}" y="${MAP.tills.y}" width="${MAP.tills.w}" height="${MAP.tills.h}" rx="6" fill="#1a4634"/>
    <text x="${MAP.tills.x+12}" y="${MAP.tills.y+18}" fill="#fff" font-size="12">Tills</text>
    ${rects}
    <path class="map-path" d="${d}" opacity="${preview?0.45:1}"/>
    ${labels}${marks}
  </svg>`;
}
function zoneSelect(it){
  const opts = order.map(id=>`<option value="${id}" ${it.zoneId===id?"selected":""}>${esc(BY[id].name)}</option>`).join("");
  return `<select class="zone-pick" data-zone="${it.id}" aria-label="Which aisle is ${esc(it.name)} in?">
    <option value="" disabled ${it.zoneId==="unplaced"?"selected":""}>Pick an aisle…</option>${opts}</select>`;
}
function itemRow(it){
  const showPick = (it.zoneId === "unplaced" && view === "shop") || moving === it.id;
  return `<div class="item ${it.checked?"done":""}">
    <div class="main">
      <input type="checkbox" data-check="${it.id}" ${it.checked?"checked":""} aria-label="Got ${esc(it.name)}"/>
      <button class="name" type="button" data-checkbtn="${it.id}">${esc(it.name)} <span class="badge">${esc(qtyText(it))}</span>${it.unsure?' <span class="badge guess">· guess</span>':""}${it.deferred?' <span class="badge">· later</span>':""}</button>
      <div class="qty"><button type="button" data-qty="${it.id}" data-d="-1" aria-label="One less">−</button><span>${it.qty}</span><button type="button" data-qty="${it.id}" data-d="1" aria-label="One more">+</button></div>
    </div>
    ${showPick ? zoneSelect(it) : ""}
    <div class="acts">
      <button class="skip" type="button" data-skip="${it.id}">${it.deferred?"Back on the list":"Can't find"}</button>
      ${it.zoneId !== "unplaced" ? `<button class="skip" type="button" data-move="${it.id}">${moving===it.id?"Cancel move":"Wrong aisle?"}</button>` : ""}
      ${it.unsure && moving !== it.id ? `<button class="skip ok-guess" type="button" data-okguess="${it.id}">✓ ${esc(BY[it.zoneId].name)} is right</button>` : ""}
      <button class="skip" type="button" data-del="${it.id}">Remove</button>
    </div>
  </div>`;
}
function listView(){
  const left = stopsOf(true);
  const mapStops = state.items.length ? (left.length ? left : stopsOf(false)) : order;
  const groups = order.filter(id=>state.items.some(i=>i.zoneId===id)).map(id=>({id, items:state.items.filter(i=>i.zoneId===id)}));
  const toCheck = state.items.filter(i=>!i.checked && (i.unsure || i.zoneId==="unplaced"));
  const remaining = state.items.filter(i=>!i.checked);
  return `
    <p class="kicker">AllTheAldi · Ireland</p>
    <h1>Aisle Run</h1>
    <p class="lede">Your list, sorted for the store loop. Heavy goods before chilled, frozen last. Saved on this phone.</p>
    <form class="row" id="add">
      <input id="q" type="text" placeholder="Add an item, or paste a list" autocomplete="off" enterkeyhint="done" value="${esc(draft)}"/>
      <button class="btn" type="submit">Add</button>
    </form>
    ${hint && !state.items.length ? `<div class="hint">Most Irish Aldi stores follow a similar loop. If yours is laid out differently, tap <b>Arrange my store</b> below the map. <button class="skip" id="got" type="button">Got it</button></div>`:""}
    ${toCheck.length ? `<section class="check" aria-live="polite">
      <h2>🤔 Check ${toCheck.length === 1 ? "this one" : "these " + toCheck.length}</h2>
      <p class="sub">I wasn't sure which aisle. Tap ✓ if my guess is right, or pick the right one. I'll remember next time.</p>
      ${toCheck.map(it=>`<div class="check-row">
        <div class="check-name">${esc(it.name)} <span class="badge">${esc(qtyText(it))}</span></div>
        <div class="check-ctrl">
          ${zoneSelect(it)}
          ${it.zoneId !== "unplaced" ? `<button class="btn tiny" type="button" data-okguess="${it.id}" aria-label="Yes, ${esc(BY[it.zoneId].name)} is right">✓</button>` : ""}
        </div>
      </div>`).join("")}
    </section>` : ""}
    <section class="card">
      <div class="card-head"><h2>The walk</h2><span class="sub">${state.items.length ? left.length+" stop"+(left.length===1?"":"s")+" left" : (isCustom()?"Your store's order":"Typical Irish floor plan")}</span></div>
      ${mapSvg(mapStops, !state.items.length)}
      <button class="arrange-link" id="arrange" type="button">🗺️ Arrange my store${isCustom()?" · your order":""}</button>
    </section>
    ${state.items.length ? groups.map(g=>`
      <section class="zone">
        <h3>${g.id==="unplaced" ? "• Not sure where these go" : stopNo(g.id)+". "+esc(BY[g.id].name)}</h3>
        ${g.items.map(itemRow).join("")}
      </section>`).join("")
      : `<div class="empty"><h2>Nothing in the trolley yet</h2><p class="lede" style="margin:8px auto">Type what you need, or paste milk, rashers, Tayto.</p><button class="btn" id="sample" type="button" style="margin-top:12px">Load a typical weekly shop</button></div>`}
    ${state.items.length ? `<div class="actions">
      <button class="btn line" id="copy" type="button">${navigator.share ? "Share list" : "Copy list"}</button>
      ${state.items.some(i=>i.checked)?`<button class="btn line" id="clearDone" type="button">Clear got</button>`:""}
      <button class="btn ghost" id="clearAll" type="button">New list</button>
    </div>`:""}
    <p class="credit"><img alt="Created by the Spectrum Tech Engine" src="${LOGO}"/></p>
    ${remaining.length ? `<div class="bar"><button class="btn" id="start" type="button">Start the walk</button></div>`:""}`;
}
function shopView(){
  const seq = openStops();
  if (!seq.length){ view = "list"; return listView(); }
  if (shopIdx >= seq.length) shopIdx = seq.length-1;
  const id = seq[shopIdx];
  const items = id==="later" ? state.items.filter(i=>!i.checked && i.deferred) : state.items.filter(i=>!i.checked && !i.deferred && i.zoneId===id);
  const title = id==="later" ? "Have another look" : BY[id].name;
  const sub = id==="later" ? "Skipped items, before the tills" : BY[id].hint;
  const next = seq[shopIdx+1];
  return `<div class="shop">
    <header><button class="btn line" id="leave" type="button">Close</button><span class="badge">${shopIdx+1} / ${seq.length}</span></header>
    <p class="kicker" style="margin-top:18px">AllTheAldi</p>
    <h1>${esc(title)}</h1>
    <p class="lede">${esc(sub)}</p>
    <section class="card">${mapSvg(seq.filter(s=>s!=="later"), false)}</section>
    <div style="margin-top:12px">${items.map(itemRow).join("") || `<p class="lede">Nothing left here.</p>`}</div>
    <div class="actions">
      ${shopIdx>0?`<button class="btn line" id="prev" type="button">Back</button>`:""}
      <button class="btn" id="next" type="button">${next ? "Next · "+esc(next==="later"?"Another look":BY[next].short) : "Finish"}</button>
    </div>
  </div>`;
}
function arrangeView(){
  return `<div class="shop">
    <header><button class="btn line" id="arrDone" type="button">Done</button><span class="badge">${isCustom()?"Your store's order":"Typical layout"}</span></header>
    <p class="kicker" style="margin-top:18px">AllTheAldi</p>
    <h1>Arrange my store</h1>
    <p class="lede">Put the departments in the order you walk past them in your local Aldi. Your list and route will follow this order. Saved on this phone.</p>
    <ol class="arr">${order.map((id,i)=>`<li>
      <span class="arr-no">${i+1}</span><span class="arr-name">${esc(BY[id].name)}</span>
      <button type="button" class="arr-btn" data-up="${i}" ${i===0?"disabled":""} aria-label="Move ${esc(BY[id].name)} earlier">▲</button>
      <button type="button" class="arr-btn" data-down="${i}" ${i===order.length-1?"disabled":""} aria-label="Move ${esc(BY[id].name)} later">▼</button>
    </li>`).join("")}</ol>
    <p class="lede">Tip: keep Frozen near the end so nothing thaws on the way home.</p>
    <div class="actions">${isCustom()?`<button class="btn line" id="arrReset" type="button">Back to the typical layout</button>`:""}</div>
  </div>`;
}

/* ---------- Little messages ---------- */
let toastTimer = null;
function toast(msg, actionLabel, action){
  let el = document.getElementById("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.innerHTML = esc(msg) + (actionLabel ? ` <button type="button" id="toastBtn">${esc(actionLabel)}</button>` : "");
  el.classList.add("show");
  if (actionLabel) document.getElementById("toastBtn").onclick = () => { el.classList.remove("show"); action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), actionLabel ? 6000 : 2500);
}
function listText(){
  const lines = ["AllTheAldi — Aldi Ireland", "", "Door to till, no doubling back", ""];
  let n = 0;
  for (const id of walk()){
    const items = state.items.filter(i=>i.zoneId===id); if (!items.length) continue; n++;
    lines.push((id==="unplaced" ? "•" : n) + ". " + BY[id].name);
    for (const it of items) lines.push("  [" + (it.checked?"x":" ") + "] " + it.name + (qtyText(it) ? "  "+qtyText(it) : ""));
    lines.push("");
  }
  return lines.join("\n");
}
function showTextToCopy(text){
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-box"><h2>Your list</h2><p class="lede">Press and hold to select it, then copy.</p><textarea readonly>${esc(text)}</textarea><button class="btn" type="button">Done</button></div>`;
  document.body.appendChild(el);
  el.querySelector("button").onclick = () => el.remove();
  const ta = el.querySelector("textarea"); ta.focus(); ta.select();
}

/* ---------- Screens and taps ---------- */
function render(){
  const root = document.getElementById("app");
  const y = window.scrollY;
  root.innerHTML = view === "shop" ? shopView() : view === "arrange" ? arrangeView() : listView();
  bind();
  if (view === "list") window.scrollTo(0, y);
  if (focusBox){ focusBox = false; const q = document.getElementById("q"); if (q) q.focus(); }
}
function findItem(id){ return state.items.find(i=>i.id===id); }
function bind(){
  const q = document.getElementById("q");
  const form = document.getElementById("add");
  if (form){
    form.onsubmit = e => { e.preventDefault(); if (!addRaw(q.value)) return; draft = ""; focusBox = true; save(); render(); };
    q.oninput = () => { draft = q.value; };
  }
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("got", ()=>{ hint = false; save(); render(); });
  on("sample", ()=>{ for (const row of SAMPLE){ const c = classify(row.name); merge(row.name, row.qty, row.unit, c.zone, !c.sure); } save(); render(); });
  on("copy", async ()=>{
    const text = listText();
    if (navigator.share){ try{ await navigator.share({title:"Aldi list", text}); return; }catch(e){ if (e && e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(text); toast("List copied. Paste it anywhere."); }
    catch(e){ showTextToCopy(text); }
  });
  on("clearDone", ()=>{ state.items = state.items.filter(i=>!i.checked); save(); render(); });
  on("clearAll", ()=>{
    undoItems = state.items.slice(); state.items = []; save(); render();
    toast("List cleared.", "Undo", ()=>{ state.items = undoItems; undoItems = null; save(); render(); });
  });
  on("start", ()=>{ view = "shop"; shopIdx = 0; moving = null; render(); window.scrollTo(0,0); });
  on("leave", ()=>{ view = "list"; render(); });
  on("next", ()=>{ const seq = openStops(); if (shopIdx >= seq.length-1){ view = "list"; toast("All done! Off to the tills."); } else shopIdx++; render(); window.scrollTo(0,0); });
  on("prev", ()=>{ shopIdx = Math.max(0, shopIdx-1); render(); window.scrollTo(0,0); });
  on("arrange", ()=>{ view = "arrange"; render(); window.scrollTo(0,0); });
  on("arrDone", ()=>{ view = "list"; render(); window.scrollTo(0,0); });
  on("arrReset", ()=>{ order = TYPICAL.slice(); writeJSON(ORDER_KEY, order); render(); toast("Back to the typical layout."); });
  const swap = (i, j) => { [order[i], order[j]] = [order[j], order[i]]; writeJSON(ORDER_KEY, order); render(); };
  document.querySelectorAll("[data-up]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.up; if (i>0) swap(i, i-1); });
  document.querySelectorAll("[data-down]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.down; if (i<order.length-1) swap(i, i+1); });
  const toggle = id => { const it = findItem(id); if (!it) return; it.checked = !it.checked; if (it.checked) it.deferred = false; save(); render(); };
  document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>toggle(el.dataset.check));
  document.querySelectorAll("[data-checkbtn]").forEach(el=>el.onclick=()=>toggle(el.dataset.checkbtn));
  document.querySelectorAll("[data-qty]").forEach(el=>el.onclick=()=>{
    const it = findItem(el.dataset.qty); if (!it) return;
    it.qty += Number(el.dataset.d);
    if (it.qty < 1){
      const gone = it, at = state.items.indexOf(it);
      state.items = state.items.filter(i=>i.id!==it.id);
      toast(gone.name + " removed.", "Undo", ()=>{ gone.qty = 1; state.items.splice(at, 0, gone); save(); render(); });
    }
    save(); render();
  });
  document.querySelectorAll("[data-skip]").forEach(el=>el.onclick=()=>{ const it = findItem(el.dataset.skip); if (!it) return; it.deferred = !it.deferred; save(); render(); });
  document.querySelectorAll("[data-move]").forEach(el=>el.onclick=()=>{ moving = moving===el.dataset.move ? null : el.dataset.move; render(); });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{
    const it = findItem(el.dataset.del); if (!it) return;
    const at = state.items.indexOf(it);
    state.items = state.items.filter(i=>i.id!==it.id); save(); render();
    toast(it.name + " removed.", "Undo", ()=>{ state.items.splice(at, 0, it); save(); render(); });
  });
  document.querySelectorAll("[data-okguess]").forEach(el=>el.onclick=()=>{
    const it = findItem(el.dataset.okguess); if (!it) return;
    it.unsure = false;
    learned[norm(it.name)] = it.zoneId; writeJSON(LEARN_KEY, learned);
    save(); render();
    toast("Got it. " + it.name + " goes in " + BY[it.zoneId].name + ".");
  });
  document.querySelectorAll("[data-zone]").forEach(el=>el.onchange=()=>{
    const it = findItem(el.dataset.zone); if (!it || !el.value) return;
    it.zoneId = el.value; it.unsure = false; moving = null;
    learned[norm(it.name)] = el.value; writeJSON(LEARN_KEY, learned);   // remember it for next time
    save(); render();
    toast("Moved to " + BY[el.value].name + ". I'll remember that.");
  });
}
render();
</script>
</body>
</html>
